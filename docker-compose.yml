services:
  db:
    image: postgres:16-alpine
    container_name: pozhnadzor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pozhnadzor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pozhnadzor']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pozhnadzor_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/pozhnadzor
      JWT_SECRET_KEY: super-secret-jwt-key-for-pozhnadzor-2025
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000", "http://localhost:5173", "http://127.0.0.1:5173"]'
    ports:
      - '8000:8000'

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pozhnadzor_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - '3000:3000'

volumes:
  postgres_data:
